name: densenet
architecture: DenseNet121
pretrained: imagenet
num_classes: 7
batch_size: 32

training:
  freeze_backbone: false
  unfreeze_layers: null   # e.g., ["denseblock4", "transition3"] para unfreezing
  optimizer:
    lr: 7.91e-5
    weight_decay: 0.01
  scheduler:
    name: CosineAnnealingLR
  loss:
    label_smoothing: 0.0
