name: convnext_tiny
architecture: ConvNeXt-Tiny
pretrained: imagenet
num_classes: 7
batch_size: 32

# Documentación de hiperparámetros sugeridos para Fase 1.
# El script train_classifier.py NO lee este YAML; valores reales vienen de CLI.
training:
  freeze_backbone: false
  unfreeze_layers: null
  optimizer:
    lr: 1e-4
    weight_decay: 0.05      # subido para acompañar augmentations fuertes (modern)
  scheduler:
    name: CosineAnnealingLR
  loss:
    label_smoothing: 0.1    # default modern; CLI override disponible

# Modern recipe activa: RandAug, RandomErasing, RRC, MixUp, CutMix, Focal,
# warmup, two-stage, LLRD=0.75, TTA. Ver Codigo/src/training/recipes.py.
